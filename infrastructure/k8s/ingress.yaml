apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skilldna-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: app.skilldna.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: skilldna-frontend-service
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: skilldna-backend-service
            port:
              number: 5000
